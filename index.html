<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Penta Source – Cyber Safety Awareness</title>

    <!-- CSS LINK -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">LOGO</div>

        <nav>
            <a href="#">Kahoot</a>
            <a href="#">Brochure</a>
            <a href="#">Video</a>
        </nav>

        <div class="team-name">THE PENTA SOURCE</div>
    </header>

    <!-- MAIN CONTENT -->
    <section class="container">
        <div class="cards">

            <!-- K A H O O T  -->
            <div class="card" onclick="openLink('LINK_TO_KAHOOT')">

                <div class="card-title">Cyber Safety Quiz (Kahoot)</div>
                <div class="card-desc">Test your knowledge on privacy and online risks.</div>
            </div>

            <!-- B R O C H U R E -->
            <div class="card" onclick="openLink('LINK_TO_BROCHURE')">
                <img src="IMAGE_LINK_BROCHURE" alt="Brochure Preview">
                <div class="card-title">Awareness Brochure</div>
                <div class="card-desc">A handy guide to stay safe online.</div>
            </div>

            <!-- V I D E O -->
            <div class="card" onclick="openLink('LINK_TO_VIDEO')">
                <img src="IMAGE_LINK_VIDEO" alt="Video Preview">
                <div class="card-title">Cyber Safety Video</div>
                <div class="card-desc">Quick tips to secure your online presence.</div>
            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <nav>
            <a href="#">Kahoot</a>
